name: Repository consistency

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git -c advice.detachedHead=false checkout --detach FETCH_HEAD

      - name: Verify canonical entrypoints and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 verify_repository.py
